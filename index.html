<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mátrix Labor — Interaktív Gyermek Fejlesztő & Kifestő</title>
  <style>
    :root {
      --bg-color: #02040a;
      --panel-bg: rgba(12, 27, 42, 0.92);
      --neon-cyan: #00ffcc;
      --neon-magenta: #ff00ff;
      --neon-blue: #0088ff;
      --text-main: #ffffff;
      --accent-gold: #ffcc00;
    }

    body {
      background: radial-gradient(circle at center, #15002b 0%, var(--bg-color) 100%);
      color: var(--text-main);
      font-family: 'Courier New', Courier, monospace, sans-serif;
      margin: 0;
      padding: 10px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      text-align: center;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 1.4rem;
      color: var(--neon-cyan);
      text-shadow: 0 0 15px rgba(0,255,204,0.7);
      margin: 6px 0 2px 0;
    }

    p.subtitle {
      font-size: 0.8rem;
      color: var(--neon-magenta);
      margin: 0;
    }

    .container {
      width: 100%;
      max-width: 900px;
      background: var(--panel-bg);
      border: 3px solid var(--neon-cyan);
      border-radius: 15px;
      box-shadow: 0 0 30px rgba(0, 255, 204, 0.3);
      padding: 15px;
      box-sizing: border-box;
    }

    /* Profil sáv */
    .profile-box {
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid var(--neon-blue);
      border-radius: 10px;
      padding: 8px;
      text-align: center;
      margin-bottom: 12px;
    }

    .profile-box label {
      font-size: 0.85rem;
      color: var(--accent-gold);
      display: block;
      margin-bottom: 4px;
    }

    .profile-box input {
      background: #000;
      border: 2px solid var(--neon-cyan);
      color: var(--text-main);
      padding: 6px 12px;
      font-size: 0.95rem;
      border-radius: 6px;
      text-align: center;
      width: 80%;
      max-width: 260px;
      font-family: inherit;
    }

    /* Nézetkezelő */
    .view-section { display: none; }
    .view-section.active { display: block; }

    /* Kategória grid */
    .categories-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    @media (min-width: 650px) {
      .categories-grid { grid-template-columns: 1fr 1fr; }
    }

    .category-card {
      background: rgba(0, 0, 0, 0.5);
      border: 2px solid;
      border-radius: 12px;
      padding: 12px;
    }

    .category-card.boys { border-color: var(--neon-blue); }
    .category-card.girls { border-color: var(--neon-magenta); }

    .category-card h2 {
      font-size: 1.05rem;
      margin-top: 0;
      text-align: center;
    }
    .category-card.boys h2 { color: var(--neon-cyan); }
    .category-card.girls h2 { color: #ff99cc; }

    .task-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .task-btn {
      background: rgba(0, 255, 204, 0.15);
      border: 1px solid var(--neon-cyan);
      color: var(--text-main);
      padding: 10px;
      font-size: 0.9rem;
      border-radius: 8px;
      cursor: pointer;
      text-align: left;
      font-family: inherit;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .category-card.girls .task-btn {
      background: rgba(255, 0, 255, 0.15);
      border-color: var(--neon-magenta);
    }

    .task-btn:active { background: rgba(0, 255, 204, 0.4); }

    /* Galéria rács */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 10px;
      margin-top: 10px;
    }

    .gallery-item {
      background: rgba(0,0,0,0.7);
      border: 2px solid var(--neon-cyan);
      border-radius: 10px;
      padding: 12px;
      text-align: center;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .gallery-item:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 12px rgba(0,255,204,0.5);
    }

    .gallery-item h3 {
      font-size: 0.9rem;
      color: var(--accent-gold);
      margin: 4px 0;
    }

    /* Színező Vászon Munkaterület */
    .canvas-workspace {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    #coloringCanvas {
      background: #ffffff;
      border: 3px solid var(--neon-cyan);
      border-radius: 10px;
      cursor: crosshair;
      max-width: 100%;
      box-shadow: 0 0 20px rgba(0,255,204,0.4);
    }

    .palette {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      background: rgba(0,0,0,0.8);
      padding: 8px;
      border-radius: 8px;
      border: 1px solid var(--neon-blue);
    }

    .color-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 2px solid white;
      cursor: pointer;
      transition: transform 0.1s;
    }
    .color-btn:active, .color-btn.selected {
      transform: scale(1.15);
      border-color: var(--accent-gold);
      box-shadow: 0 0 10px var(--accent-gold);
    }

    .action-row {
      display: flex;
      gap: 10px;
    }

    .btn {
      background: var(--neon-blue);
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-family: inherit;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .btn-danger { background: #ff3333; }
    .btn-success { background: #00cc66; }

    footer {
      margin-top: 12px;
      font-size: 0.75rem;
      color: #888;
      text-align: center;
    }
  </style>
</head>
<body>

  <header>
    <h1>MÁTRIX LABOR</h1>
    <p class="subtitle">Interaktív Fejlesztő & Kifestő Birodalom (6-10 év)</p>
  </header>

  <div class="container">
    
    <!-- Profil Sáv -->
    <div class="profile-box">
      <label for="playerName">Add meg a neved, Kis Művész:</label>
      <input type="text" id="playerName" value="Kis Művész">
    </div>

    <!-- VIEW 1: FŐMENÜ -->
    <div id="mainMenuView" class="view-section active">
      <div class="categories-grid">
        
        <!-- Fiús & Univerzális Ág -->
        <div class="category-card boys">
          <h2>🚀 Kalandok & Járművek</h2>
          <div class="task-list">
            <button class="task-btn" onclick="openGallery('boys', 'szinezo')">🎨 Csak Színezős (Teljes Galéria)</button>
            <button class="task-btn" onclick="openModule('boys', 'atrajzolos')">✏️ Átrajzolós / Vonalvezetés</button>
            <button class="task-btn" onclick="openModule('boys', 'pontosszekoto')">⭐ Nyilas Pontösszekötő</button>
            <button class="task-btn" onclick="openModule('boys', 'szamolos')">🔢 Számolós & Logikai Feladatok</button>
          </div>
        </div>

        <!-- Lányos & Hercegnős Ág -->
        <div class="category-card girls">
          <h2>👑 Varázsvilág & Hercegnők</h2>
          <div class="task-list">
            <button class="task-btn" onclick="openGallery('girls', 'szinezo')">🎨 Csak Színezős (Teljes Galéria)</button>
            <button class="task-btn" onclick="openModule('girls', 'atrajzolos')">✏️ Átrajzolós (Varázskorona)</button>
            <button class="task-btn" onclick="openModule('girls', 'pontosszekoto')">⭐ Nyilas Pontösszekötő</button>
            <button class="task-btn" onclick="openModule('girls', 'szamolos')">💖 Pötty-Számláló Challenge</button>
          </div>
        </div>

      </div>
    </div>

    <!-- VIEW 2: SZÍNEZŐ GALÉRIA (Almenü) -->
    <div id="galleryView" class="view-section">
      <button class="btn btn-danger" onclick="goBackToMenu()" style="margin-bottom: 10px;">❮ Vissza a Főmenübe</button>
      <h2 id="galleryTitle" style="color: var(--neon-cyan); text-align: center; margin-top: 0; font-size: 1.1rem;">Válassz egy képet a színezéshez!</h2>
      <div id="galleryContainer" class="gallery-grid"></div>
    </div>

    <!-- VIEW 3: SZÍNEZŐ MUNKATERÜLET (Canvas) -->
    <div id="canvasView" class="view-section">
      <button class="btn btn-danger" onclick="goBackToGallery()" style="margin-bottom: 8px;">❮ Vissza a Galériába</button>
      
      <div class="canvas-workspace">
        <h3 id="activeTemplateTitle" style="color: var(--accent-gold); margin: 0; font-size: 1rem;">Színező Munkaterület</h3>
        
        <!-- Színpaletta -->
        <div class="palette" id="colorPalette"></div>

        <!-- Rajzvászon -->
        <canvas id="coloringCanvas" width="600" height="400"></canvas>

        <!-- Akció gombok -->
        <div class="action-row">
          <button class="btn btn-danger" onclick="clearCanvas()">Törlés / Újra</button>
          <button class="btn btn-success" onclick="alert('Csodás alkotás! Mentve a Mátrix Labor archívumába!')">Kész / Mentés 💾</button>
        </div>
      </div>
    </div>

  </div>

  <footer>
    Mátrix Labor Engine v1.3 • Projektigazgatás: Jordan & Nefi
  </footer>

  <script>
    // Teljes, gazdag sablonlista (visszaállítva és kibővítve)
    const coloringTemplates = {
      boys: [
        { id: 'train', name: '🚂 Gőzmozdony', desc: 'Klasszikus pöfögős vonat.' },
        { id: 'pumpkin', name: '🎃 Őszi Sütőtök', desc: 'Hangulatos évszakos sablon.' },
        { id: 'rocket', name: '🚀 Mátrix Űrsikló', desc: 'Irány a galaxis és a csillagok!' },
        { id: 'robot', name: '🤖 Robot Robi', desc: 'Varázsolj új külsőt a vidám robotnak!' }
      ],
      girls: [
        { id: 'castle', name: '🏰 Varázskastély', desc: 'Tornyok, hintók és csillogás.' },
        { id: 'mermaid', name: '🧜‍♀️ Barbie Hableány', desc: 'Víz alatti mesés birodalom.' },
        { id: 'fairy', name: '🧚‍♀️ Tündér Hercegnő', desc: 'Szárnyak, virágok és varázslat.' },
        { id: 'pegasus', name: '🦄 Unikornis Kaland', desc: 'Szivárványok és csillagos ég.' }
      ]
    };

    let currentCategory = 'boys';
    let selectedColor = '#ff0055';
    const canvas = document.getElementById('coloringCanvas');
    const ctx = canvas.getContext('2d');
    let isDrawing = false;

    // Színpaletta generálás
    const colors = ['#ff0055', '#ff9900', '#ffff00', '#00cc66', '#00ffff', '#0088ff', '#9933ff', '#ff66b2', '#8b4513', '#333333'];
    const paletteContainer = document.getElementById('colorPalette');
    
    colors.forEach((col, idx) => {
      const btn = document.createElement('div');
      btn.className = 'color-btn' + (idx === 0 ? ' selected' : '');
      btn.style.backgroundColor = col;
      btn.onclick = () => {
        document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        selectedColor = col;
      };
      paletteContainer.appendChild(btn);
    });

    function openGallery(category, type) {
      currentCategory = category;
      document.getElementById('mainMenuView').classList.remove('active');
      document.getElementById('galleryView').classList.add('active');

      const container = document.getElementById('galleryContainer');
      container.innerHTML = '';

      const templates = coloringTemplates[category] || [];
      templates.forEach(tpl => {
        const card = document.createElement('div');
        card.className = 'gallery-item';
        card.innerHTML = `
          <div style="font-size: 1.8rem; margin-bottom: 4px;">🎨</div>
          <h3>${tpl.name}</h3>
          <p style="font-size: 0.7rem; color: #aaa; margin: 2px 0 0 0;">${tpl.desc}</p>
        `;
        card.onclick = () => startColoring(tpl);
        container.appendChild(card);
      });
    }

    function startColoring(tpl) {
      document.getElementById('galleryView').classList.remove('active');
      document.getElementById('canvasView').classList.add('active');
      document.getElementById('activeTemplateTitle').innerText = tpl.name;

      // Vászon alaphelyzetbe állítása (sablon rajzolása)
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      // Kezdő kontúr / felirat a vászonra
      ctx.strokeStyle = '#222222';
      ctx.lineWidth = 4;
      ctx.strokeRect(20, 20, canvas.width - 40, canvas.height - 40);

      ctx.font = '24px Courier New';
      ctx.fillStyle = '#444444';
      ctx.textAlign = 'center';
      ctx.fillText(tpl.name, canvas.width / 2, canvas.height / 2 - 10);
      ctx.font = '16px Courier New';
      ctx.fillText('Színezd ki az ujjal vagy egérrel!', canvas.width / 2, canvas.height / 2 + 25);
    }

    // Egér / Érintés rajzolás kezelése a vásznon
    canvas.addEventListener('mousedown', startDraw);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', stopDraw);
    canvas.addEventListener('mouseleave', stopDraw);

    canvas.addEventListener('touchstart', e => { e.preventDefault(); startDraw(e.touches[0]); });
    canvas.addEventListener('touchmove', e => { e.preventDefault(); draw(e.touches[0]); });
    canvas.addEventListener('touchend', stopDraw);

    function startDraw(e) {
      isDrawing = true;
      ctx.beginPath();
      const rect = canvas.getBoundingClientRect();
      ctx.moveTo(e.clientX - rect.left, e.clientY - rect.top);
    }

    function draw(e) {
      if (!isDrawing) return;
      const rect = canvas.getBoundingClientRect();
      ctx.lineTo(e.clientX - rect.left, e.clientY - rect.top);
      ctx.strokeStyle = selectedColor;
      ctx.lineWidth = 15;
      ctx.lineCap = 'round';
      ctx.stroke();
    }

    function stopDraw() {
      isDrawing = false;
    }

    function clearCanvas() {
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    function goBackToMenu() {
      document.getElementById('galleryView').classList.remove('active');
      document.getElementById('mainMenuView').classList.add('active');
    }

    function goBackToGallery() {
      document.getElementById('canvasView').classList.remove('active');
      document.getElementById('galleryView').classList.add('active');
    }

    function openModule(category, type) {
      const name = document.getElementById('playerName').value || 'Kis Művész';
      alert(`Üdvözöllek a Laborban, ${name}!\nA(z) [${category.toUpperCase()} -> ${type.toUpperCase()}] modul fejlesztése folyamatban van.`);
    }
  </script>

</body>
</html>
